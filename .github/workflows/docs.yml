name: Docs

on:
  pull_request:
  push:
    branches: [main, integration]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint Markdown, links, OpenAPI and Mermaid diagrams
        run: npm run docs:check
