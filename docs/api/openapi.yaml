openapi: 3.1.0
info:
  title: Shift Happens API
  version: 1.0.0
  summary: Public REST API of Shift Happens, a multi-tenant SaaS for employee shift scheduling.
  description: |-
    Shift Happens is a multi-tenant SaaS for employee shift scheduling. Managers create and publish
    weekly schedules. Employees claim open shifts, swap shifts and ask colleagues to cover shifts.

    This file is the spec-first contract of the 12 operations API-01 to API-12 (deliverable 5).
    Each operation has the vendor extension `x-api-id` with its ID.

    ## Error contract

    - Every 4xx and 5xx response uses Problem Details (RFC 9457) with the media type `application/problem+json`.
    - Every problem has the members `type`, `title`, `status`, `detail`, `instance`, `code` and `traceId`.
    - Clients switch on `code`. They do not parse `title` or `detail`.
    - Extension members give the data that the client needs to react: `errors[]`, `violations[]`,
      `overridable`, `currentVersion`, `currentState`, `resource` and `retryAfterSeconds`.
    - Each operation documents every error that it can return as a named example. The name of the
      example is the `code` in lower camel case. Each example tells the cause and the client reaction.
    - All operations share the responses 401 `AUTHENTICATION_REQUIRED`, 500 `INTERNAL_ERROR` and
      503 `SERVICE_UNAVAILABLE`.
    - Error bodies never contain stack traces, SQL text or internal host names. Support uses `traceId`
      to find the request in the logs and traces.

    The full design (status semantics, error code catalogue, client reactions, rate limits and
    idempotency) is in [Error handling design](../03-error-handling.md).
  contact:
    name: Shift Happens team
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.shifthappens.example/api/v1
    description: Production
  - url: https://api.staging.shifthappens.example/api/v1
    description: Staging
security:
  - cognitoBearer: []
tags:
  - name: Organization
    description: |-
      Members, invitations and the member lifecycle (joiner, leaver). The Organization service
      (`organization-service`) owns these resources and makes the Amazon Cognito admin calls.
  - name: Scheduling
    description: |-
      Schedules, shifts, assignments and claims. The Scheduling service (`scheduling-service`) owns
      these resources, runs the labor rule engine and protects capacity with row locks.
  - name: Trades
    description: |-
      Trade requests (`SWAP` and `COVER`). The Trade service (`trade-service`) is the orchestrator of
      the trade saga. The Scheduling service executes the trade in one local transaction.
  - name: Analytics
    description: |-
      Coverage analytics. The Analytics service (`analytics-service`) answers from an eventually
      consistent read model.
paths:
  /orgs/{orgId}/invitations:
    post:
      operationId: inviteMember
      x-api-id: API-01
      x-service: Organization service (`organization-service`)
      x-requirements: [REQ-FUNC-001]
      x-concurrency: [CS-4]
      tags: [Organization]
      summary: 'API-01: Invite a member'
      description: |-
        Creates an invitation to join the organization with a role, locations and positions. The
        Organization service sends the invitation email through Amazon SES. The invitation expires
        after 7 days. One organization can send 200 invitations per day.

        **Roles:** ADMIN (any role, any location). MANAGER (role EMPLOYEE, own locations only).

        **Concurrency:** CS-4. The `Idempotency-Key` header is optional. With a key, a retry after a timeout does not send a second invitation.

        **Requirements:** REQ-FUNC-001.

        **API ID:** `x-api-id: API-01`.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
            examples:
              inviteBarista:
                summary: Iryna Bondar invites Taras Melnyk as a barista of Rynok Square
                value:
                  email: 'taras.melnyk@example.com'
                  role: EMPLOYEE
                  locationIds: ['7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a']
                  positionIds: ['a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d']
      responses:
        '201':
          description: The invitation is created and the invitation email is queued.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
              examples:
                invitationCreated:
                  summary: A pending invitation
                  value:
                    id: '2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6f'
                    orgId: '0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e'
                    email: 'taras.melnyk@example.com'
                    role: EMPLOYEE
                    locationIds: ['7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a']
                    positionIds: ['a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d']
                    status: PENDING
                    expiresAt: '2026-11-05T10:30:00+02:00'
                    createdAt: '2026-10-29T10:30:00+02:00'
        '400':
          description: 'The body does not agree with the schema. Code: `VALIDATION_FAILED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                validationFailed:
                  summary: The email is not valid
                  description: |-
                    **Cause:** Iryna Bondar sends `"email": "taras.melnyk@"`.

                    **Client reaction:** Show the message next to the email field and do not retry without a change.
                  value:
                    type: 'https://docs.shifthappens.example/problems/validation-failed'
                    title: Request validation failed
                    status: 400
                    detail: The request body has 1 field error.
                    instance: '/api/v1/orgs/0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e/invitations'
                    code: VALIDATION_FAILED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    errors:
                      - pointer: /email
                        code: INVALID_FORMAT
                        message: Must be a valid email address.
        '403':
          description: 'The caller cannot invite this member. Codes: `ROLE_NOT_ALLOWED`, `LOCATION_SCOPE_DENIED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                roleNotAllowed:
                  summary: A manager invites a MANAGER
                  description: |-
                    **Cause:** Iryna Bondar (MANAGER) sends `"role": "MANAGER"`.

                    **Client reaction:** Show only the role EMPLOYEE in the invitation form of a manager and do not retry.
                  value:
                    type: 'https://docs.shifthappens.example/problems/role-not-allowed'
                    title: Role not allowed
                    status: 403
                    detail: A MANAGER can invite members with the role EMPLOYEE only.
                    instance: '/api/v1/orgs/0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e/invitations'
                    code: ROLE_NOT_ALLOWED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                locationScopeDenied:
                  summary: The location is not in the scope of the manager
                  description: |-
                    **Cause:** A manager of another location sends the Rynok Square location in `locationIds`.

                    **Client reaction:** Do not retry, reload the membership context with `GET /me` and show only the locations from it.
                  value:
                    type: 'https://docs.shifthappens.example/problems/location-scope-denied'
                    title: Location not in scope
                    status: 403
                    detail: Location 7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a is not in your scope.
                    instance: '/api/v1/orgs/0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e/invitations'
                    code: LOCATION_SCOPE_DENIED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
        '404':
          description: 'A location in `locationIds` is not in the organization. Code: `RESOURCE_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
              examples:
                resourceNotFound:
                  summary: The location does not exist in the organization
                  description: |-
                    **Cause:** Iryna Bondar sends a location ID that Lviv Coffee Co. does not have.

                    **Client reaction:** Remove the location from the form, reload the list of locations and do not retry.
                  value:
                    type: 'https://docs.shifthappens.example/problems/resource-not-found'
                    title: Resource not found
                    status: 404
                    detail: Location 5f6a7b8c-9d0e-4f1a-8b2c-3d4e5f6a7b8c was not found.
                    instance: '/api/v1/orgs/0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e/invitations'
                    code: RESOURCE_NOT_FOUND
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    resource:
                      type: Location
                      id: '5f6a7b8c-9d0e-4f1a-8b2c-3d4e5f6a7b8c'
        '409':
          description: 'The email already has a membership or a pending invitation. Codes: `ALREADY_MEMBER`, `INVITATION_ALREADY_PENDING`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
              examples:
                alreadyMember:
                  summary: The email belongs to an active member
                  description: |-
                    **Cause:** Iryna Bondar invites `olena.kovalenko@example.com`, the email of an active member.

                    **Client reaction:** Show the profile of the member from `currentState.userId` and do not retry.
                  value:
                    type: 'https://docs.shifthappens.example/problems/already-member'
                    title: Already a member
                    status: 409
                    detail: The email olena.kovalenko@example.com belongs to an active member.
                    instance: '/api/v1/orgs/0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e/invitations'
                    code: ALREADY_MEMBER
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    currentState:
                      userId: '5b1e6c2a-8f3d-4a7e-9c1b-2d4f6a8e0c13'
                      status: ACTIVE
                invitationAlreadyPending:
                  summary: A pending invitation for this email exists
                  description: |-
                    **Cause:** Iryna Bondar invites `taras.melnyk@example.com` a second time on the same day.

                    **Client reaction:** Offer "Resend invitation" for `currentState.invitationId` and do not create a second invitation.
                  value:
                    type: 'https://docs.shifthappens.example/problems/invitation-already-pending'
                    title: Invitation already pending
                    status: 409
                    detail: A pending invitation for taras.melnyk@example.com exists. It expires at 2026-11-05T10:30:00+02:00.
                    instance: '/api/v1/orgs/0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e/invitations'
                    code: INVITATION_ALREADY_PENDING
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    currentState:
                      invitationId: '2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6f'
                      status: PENDING
                      expiresAt: '2026-11-05T10:30:00+02:00'
        '429':
          description: |-
            A quota is empty. Codes: `INVITATION_QUOTA_EXCEEDED` (200 invitations per organization per day,
            reset at 00:00 UTC) and `RATE_LIMITED` (policy `invitations`, 20 invitations per user per 3600 s).
          headers:
            Retry-After:
              description: Seconds to wait. The same value as `retryAfterSeconds`.
              schema:
                type: integer
                minimum: 0
              examples:
                invitationQuotaExceeded:
                  value: 55800
                rateLimited:
                  value: 180
            RateLimit-Policy:
              description: The policies of the operation. `q` is the quota, `w` is the window in seconds.
              schema:
                type: string
              examples:
                invitationQuotaExceeded:
                  value: '"invitations";q=20;w=3600, "invitations-org";q=200;w=86400'
                rateLimited:
                  value: '"invitations";q=20;w=3600, "invitations-org";q=200;w=86400'
            RateLimit:
              description: The state of the empty policy. `r` is the remaining quota, `t` is the seconds until a reset.
              schema:
                type: string
              examples:
                invitationQuotaExceeded:
                  value: '"invitations-org";r=0;t=55800'
                rateLimited:
                  value: '"invitations";r=0;t=180'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RateLimitProblem'
              examples:
                invitationQuotaExceeded:
                  summary: The organization sent 200 invitations today
                  description: |-
                    **Cause:** Lviv Coffee Co. sent 200 invitations on 2026-10-29 (UTC). The request comes at 08:30 UTC.

                    **Client reaction:** Show the time when the quota resets (now plus `retryAfterSeconds`) and do not retry automatically.
                  value:
                    type: 'https://docs.shifthappens.example/problems/invitation-quota-exceeded'
                    title: Invitation quota exceeded
                    status: 429
                    detail: Lviv Coffee Co. sent 200 invitations today. The quota resets at 2026-10-30T00:00:00Z.
                    instance: '/api/v1/orgs/0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e/invitations'
                    code: INVITATION_QUOTA_EXCEEDED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    retryAfterSeconds: 55800
                rateLimited:
                  summary: The user sent 20 invitations in 3600 s
                  description: |-
                    **Cause:** Iryna Bondar sent 20 invitations in the last 3600 s.

                    **Client reaction:** Disable the Invite button with a countdown of `Retry-After` seconds, then let the user send again.
                  value:
                    type: 'https://docs.shifthappens.example/problems/rate-limited'
                    title: Too many requests
                    status: 429
                    detail: You sent 20 invitations in 3600 s. Wait 180 s.
                    instance: '/api/v1/orgs/0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e/invitations'
                    code: RATE_LIMITED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    retryAfterSeconds: 180
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /invitations/accept:
    post:
      operationId: acceptInvitation
      x-api-id: API-02
      x-service: Organization service (`organization-service`)
      x-requirements: [REQ-FUNC-002]
      x-concurrency: []
      tags: [Organization]
      summary: 'API-02: Accept an invitation'
      description: |-
        Accepts an invitation and creates an `ACTIVE` membership for the signed-in user (joiner flow).
        The token comes from the invitation email. It is in the body and not in the path, so it does
        not appear in access logs. The email of the Cognito user must be the invited email.

        **Roles:** Any signed-in user who received the invitation. The user does not need a membership yet.

        **Concurrency:** None. A second accept of the same invitation returns 409 `INVITATION_ALREADY_USED`.

        **Requirements:** REQ-FUNC-002.

        **API ID:** `x-api-id: API-02`.
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
            examples:
              acceptToken:
                summary: Taras Melnyk accepts the invitation 2 days after he got it
                value:
                  token: 5azWI546XhqexM0bBUFYryBRp6-ykIPBG_n8lZKO8aU
      responses:
        '200':
          description: The membership is active.
          headers:
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
              examples:
                membershipActive:
                  summary: The new membership
                  value:
                    orgId: '0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e'
                    userId: '6c2f7d3b-9a4e-4b8f-8d2c-3e5a7b9f1d24'
                    role: EMPLOYEE
                    locationIds: ['7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a']
                    positionIds: ['a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d']
                    status: ACTIVE
                    joinedAt: '2026-10-31T09:15:00+02:00'
        '400':
          description: 'The token does not have the correct format. Code: `VALIDATION_FAILED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                validationFailed:
                  summary: The token is too short
                  description: |-
                    **Cause:** The user copied only a part of the link, and the SPA sends `"token": "5azWI546Xhqex"`.

                    **Client reaction:** Tell the user to open the link from the invitation email again and do not retry.
                  value:
                    type: 'https://docs.shifthappens.example/problems/validation-failed'
                    title: Request validation failed
                    status: 400
                    detail: The request body has 1 field error.
                    instance: /api/v1/invitations/accept
                    code: VALIDATION_FAILED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    errors:
                      - pointer: /token
                        code: INVALID_FORMAT
                        message: Must be 43 characters from the base64url alphabet.
        '403':
          description: 'The signed-in email is not the invited email. Code: `INVITATION_EMAIL_MISMATCH`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invitationEmailMismatch:
                  summary: The user signed in with another email
                  description: |-
                    **Cause:** Taras Melnyk signs in with a personal email, but the invitation is for `taras.melnyk@example.com`.

                    **Client reaction:** Tell the user to sign out and sign in with the email that received the invitation.
                  value:
                    type: 'https://docs.shifthappens.example/problems/invitation-email-mismatch'
                    title: Invitation email mismatch
                    status: 403
                    detail: The email of your account is not the email of the invitation.
                    instance: /api/v1/invitations/accept
                    code: INVITATION_EMAIL_MISMATCH
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
        '404':
          description: 'No invitation has this token. Code: `RESOURCE_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
              examples:
                resourceNotFound:
                  summary: The token is not known
                  description: |-
                    **Cause:** The token has the correct format, but no invitation has it. The problem does not repeat the token, because the token is a secret.

                    **Client reaction:** Show "The invitation link is not valid", tell the user to ask for a new invitation and do not retry.
                  value:
                    type: 'https://docs.shifthappens.example/problems/resource-not-found'
                    title: Resource not found
                    status: 404
                    detail: No invitation has this token.
                    instance: /api/v1/invitations/accept
                    code: RESOURCE_NOT_FOUND
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    resource:
                      type: Invitation
        '409':
          description: 'The invitation was accepted before. Code: `INVITATION_ALREADY_USED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
              examples:
                invitationAlreadyUsed:
                  summary: The invitation is accepted already
                  description: |-
                    **Cause:** Taras Melnyk opens the invitation link a second time after he accepted it.

                    **Client reaction:** Go to the app home page.
                  value:
                    type: 'https://docs.shifthappens.example/problems/invitation-already-used'
                    title: Invitation already used
                    status: 409
                    detail: The invitation was accepted at 2026-10-31T09:15:00+02:00.
                    instance: /api/v1/invitations/accept
                    code: INVITATION_ALREADY_USED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    currentState:
                      status: ACCEPTED
        '422':
          description: 'The invitation is older than 7 days. Code: `INVITATION_EXPIRED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invitationExpired:
                  summary: The invitation expired
                  description: |-
                    **Cause:** Taras Melnyk opens the link on 2026-11-06, 8 days after the invitation.

                    **Client reaction:** Tell the user to ask the admin or the manager for a new invitation.
                  value:
                    type: 'https://docs.shifthappens.example/problems/invitation-expired'
                    title: Invitation expired
                    status: 422
                    detail: The invitation expired at 2026-11-05T10:30:00+02:00. An invitation is valid for 7 days.
                    instance: /api/v1/invitations/accept
                    code: INVITATION_EXPIRED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /orgs/{orgId}/members/{userId}/deactivate:
    post:
      operationId: deactivateMember
      x-api-id: API-03
      x-service: Organization service (`organization-service`)
      x-requirements: [REQ-FUNC-004]
      x-concurrency: []
      tags: [Organization]
      summary: 'API-03: Deactivate a member'
      description: |-
        Deactivates a member (leaver flow). The membership status changes to `DEACTIVATED` first.
        Every request checks the status, so unexpired access tokens become invalid within the 60 s
        cache TTL of the Edge Gateway. Then the Organization service calls Cognito `AdminDisableUser`
        and `AdminUserGlobalSignOut`. The event `MemberDeactivated` starts the cleanup in other services:
        the Scheduling service cancels future assignments and the Trade service cancels pending trade
        requests. The cleanup is asynchronous.

        **Roles:** ADMIN with TOTP MFA.

        **Concurrency:** None. A second deactivation returns 409 `MEMBER_ALREADY_DEACTIVATED`.

        **Requirements:** REQ-FUNC-004.

        **API ID:** `x-api-id: API-03`.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateMemberRequest'
            examples:
              contractEnded:
                summary: Andrii Shevchenko deactivates Taras Melnyk
                value:
                  reason: Contract ended
      responses:
        '200':
          description: The member is deactivated. The cleanup in other services continues asynchronously.
          headers:
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              examples:
                memberDeactivated:
                  summary: The deactivated member
                  value:
                    userId: '6c2f7d3b-9a4e-4b8f-8d2c-3e5a7b9f1d24'
                    orgId: '0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e'
                    status: DEACTIVATED
                    deactivatedAt: '2026-11-09T11:00:00+02:00'
        '400':
          description: 'The body does not agree with the schema. Code: `VALIDATION_FAILED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                validationFailed:
                  summary: The reason is missing
                  description: |-
                    **Cause:** Andrii Shevchenko sends the body `{}`.

                    **Client reaction:** Show the message next to the reason field and do not retry without a change.
                  value:
                    type: 'https://docs.shifthappens.example/problems/validation-failed'
                    title: Request validation failed
                    status: 400
                    detail: The request body has 1 field error.
                    instance: '/api/v1/orgs/0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e/members/6c2f7d3b-9a4e-4b8f-8d2c-3e5a7b9f1d24/deactivate'
                    code: VALIDATION_FAILED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    errors:
                      - pointer: /reason
                        code: REQUIRED
                        message: Is required.
        '403':
