  /trade-requests/{tradeRequestId}/decision:
    post:
      operationId: decideTradeRequest
      x-api-id: API-11
      x-service: Trade service (`trade-service`)
      x-requirements: [REQ-FUNC-014, REQ-FUNC-016]
      x-concurrency: [CS-3]
      tags: [Trades]
      summary: 'API-11: Approve or reject a trade request'
      description: |-
        A manager approves or rejects a trade request in the status `PENDING_MANAGER`. Before the
        decision, the Trade service asks the Scheduling service to validate the trade again.

        `APPROVE` returns 202 with the status `EXECUTING`. The Trade service sends the command
        `ExecuteTrade`, and the Scheduling service moves the assignments and releases the trade locks
        in one local transaction (the pivot of the saga, CS-3). The final status (`APPROVED` or
        `FAILED`) comes as a notification. `REJECT` returns 200 with the status `REJECTED` and
        releases the trade locks (compensation). The server accepts `override` only with `APPROVE`.

        **Roles:** MANAGER (own locations), ADMIN.

        **Concurrency:** CS-3 (orchestrated saga, pivot transaction and compensation).

        **Requirements:** REQ-FUNC-014, REQ-FUNC-016.

        **API ID:** `x-api-id: API-11`.
      parameters:
        - $ref: '#/components/parameters/TradeRequestId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideTradeRequestRequest'
            examples:
              approve:
                summary: Iryna Bondar approves the swap
                value:
                  decision: APPROVE
                  comment: Approved. Both shifts stay covered.
              approveWithOverride:
                summary: Iryna Bondar approves the swap and overrides the minimum rest
                value:
                  decision: APPROVE
                  comment: Approved with an override.
                  override:
                    reason: Taras agreed to the short rest before the Thursday shift.
              reject:
                summary: Iryna Bondar rejects the swap
                value:
                  decision: REJECT
                  comment: Taras works late on Wednesday. Ask another colleague.
      responses:
        '202':
          description: The trade request is approved and the Scheduling service executes it. The final status comes as a notification.
          headers:
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeRequest'
              examples:
                tradeExecuting:
                  summary: The approved swap in execution
                  value:
                    id: '1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e'
                    type: SWAP
                    status: EXECUTING
                    requesterId: '5b1e6c2a-8f3d-4a7e-9c1b-2d4f6a8e0c13'
                    offeredAssignmentId: 'e6f7a8b9-c0d1-4e2f-9a3b-4c5d6e7f8091'
                    requestedAssignmentId: 'f7a8b9c0-d1e2-4f3a-8b4c-5d6e7f809102'
                    targetEmployeeId: '6c2f7d3b-9a4e-4b8f-8d2c-3e5a7b9f1d24'
                    acceptedBy: '6c2f7d3b-9a4e-4b8f-8d2c-3e5a7b9f1d24'
                    message: Can we swap? I have a doctor appointment on Thursday morning.
                    expiresAt: '2026-11-04T08:00:00+02:00'
                    createdAt: '2026-11-02T10:00:00+02:00'
                    version: 3
        '200':
          description: The trade request is rejected. The trade locks are released.
          headers:
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
