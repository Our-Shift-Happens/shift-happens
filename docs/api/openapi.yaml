  /trade-requests/{tradeRequestId}/accept:
    post:
      operationId: acceptTradeRequest
      x-api-id: API-10
      x-service: Trade service (`trade-service`)
      x-requirements: [REQ-FUNC-013]
      x-concurrency: [CS-3]
      tags: [Trades]
      summary: 'API-10: Accept a trade request'
      description: |-
        The target employee accepts a trade request. For a `COVER` without a target, any active
        employee of the location who is qualified for the position can accept. The first accept wins,
        and the others get 409 `TRADE_NOT_PENDING`.

        The Trade service calls the Scheduling service. The Scheduling service checks the labor rules
        for the new owners and, for a `SWAP`, places a trade lock on the requested assignment (CS-3).
        The status changes from `PENDING_PEER` to `PENDING_MANAGER`. The request has no body.

        **Roles:** EMPLOYEE (the target of the trade request, or a qualified colleague for an open cover).

        **Concurrency:** CS-3 (orchestrated saga and trade lock).

        **Requirements:** REQ-FUNC-013.

        **API ID:** `x-api-id: API-10`.
      parameters:
        - $ref: '#/components/parameters/TradeRequestId'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The trade request is accepted and waits for the decision of a manager.
          headers:
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeRequest'
              examples:
                tradeAccepted:
                  summary: Taras Melnyk accepted the swap
                  value:
                    id: '1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e'
                    type: SWAP
                    status: PENDING_MANAGER
                    requesterId: '5b1e6c2a-8f3d-4a7e-9c1b-2d4f6a8e0c13'
                    offeredAssignmentId: 'e6f7a8b9-c0d1-4e2f-9a3b-4c5d6e7f8091'
                    requestedAssignmentId: 'f7a8b9c0-d1e2-4f3a-8b4c-5d6e7f809102'
                    targetEmployeeId: '6c2f7d3b-9a4e-4b8f-8d2c-3e5a7b9f1d24'
                    acceptedBy: '6c2f7d3b-9a4e-4b8f-8d2c-3e5a7b9f1d24'
                    message: Can we swap? I have a doctor appointment on Thursday morning.
                    expiresAt: '2026-11-04T08:00:00+02:00'
                    createdAt: '2026-11-02T10:00:00+02:00'
                    version: 2
        '403':
