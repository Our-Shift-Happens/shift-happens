                    code: LABOR_RULE_VIOLATION
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    violations:
                      - rule: MIN_REST
                        limit: 11
                        actual: 8
                        unit: HOURS
                        employeeId: '5b1e6c2a-8f3d-4a7e-9c1b-2d4f6a8e0c13'
