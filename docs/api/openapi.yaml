                    status: 404
                    detail: Trade request 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e was not found.
                    instance: '/api/v1/trade-requests/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e/decision'
                    code: RESOURCE_NOT_FOUND
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    resource:
                      type: TradeRequest
                      id: '1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e'
        '409':
          description: 'The trade request is not `PENDING_MANAGER`. Code: `TRADE_NOT_PENDING`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ConflictProblem'
              examples:
                tradeNotPending:
                  summary: The trade request expired
                  description: |-
                    **Cause:** The trade expiry job (CS-6) closed the request at 08:00 on 2026-11-04. Iryna Bondar decides 5 min later.

                    **Client reaction:** Reload the trade request and show its current status.
                  value:
                    type: 'https://docs.shifthappens.example/problems/trade-not-pending'
                    title: Trade request not pending
                    status: 409
                    detail: Trade request 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e is EXPIRED. Only a PENDING_MANAGER trade request can be decided.
                    instance: '/api/v1/trade-requests/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e/decision'
                    code: TRADE_NOT_PENDING
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    currentState:
                      status: EXPIRED
        '422':
          description: 'The trade breaks a labor rule or the trade cutoff. Codes: `LABOR_RULE_VIOLATION` (`overridable` is true for the manager), `TRADE_CUTOFF_PASSED`.'
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/LaborRuleProblem'
                  - $ref: '#/components/schemas/Problem'
              examples:
                laborRuleViolation:
                  summary: The swap breaks the minimum rest of the accepter
                  description: |-
                    **Cause:** After Taras Melnyk accepted, Andrii Shevchenko assigned him to a Wednesday shift until 24:00. With the Thursday shift from 08:00, his rest is 8 h.

                    **Client reaction:** Show each violation and offer "Approve with override" with a reason, or reject the trade request.
                  value:
                    type: 'https://docs.shifthappens.example/problems/labor-rule-violation'
                    title: Labor rule violation
                    status: 422
                    detail: The trade breaks 1 labor rule. You can approve it with an override.
                    instance: '/api/v1/trade-requests/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e/decision'
                    code: LABOR_RULE_VIOLATION
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    violations:
                      - rule: MIN_REST
                        limit: 11
                        actual: 8
                        unit: HOURS
                        employeeId: '6c2f7d3b-9a4e-4b8f-8d2c-3e5a7b9f1d24'
                        conflictingAssignmentId: '0c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f'
                    overridable: true
                tradeCutoffPassed:
                  summary: The trade cutoff passed
                  description: |-
                    **Cause:** Iryna Bondar decides 20 s after the cutoff (08:00 on 2026-11-04). The expiry job did not close the request yet, but the server checks the time itself.

                    **Client reaction:** Tell the manager to change the assignments directly in the schedule.
                  value:
                    type: 'https://docs.shifthappens.example/problems/trade-cutoff-passed'
                    title: Trade cutoff passed
                    status: 422
                    detail: The trade cutoff of this trade request passed at 2026-11-04T08:00:00+02:00.
                    instance: '/api/v1/trade-requests/1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e/decision'
                    code: TRADE_CUTOFF_PASSED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /locations/{locationId}/analytics/coverage:
    get:
      operationId: getLocationCoverage
      x-api-id: API-12
      x-service: Analytics service (`analytics-service`)
      x-requirements: [REQ-FUNC-018]
      x-concurrency: []
      tags: [Analytics]
      summary: 'API-12: Get the coverage of a location'
      description: |-
        Returns the coverage of a location for a date range: required slots, filled slots, coverage
        rate and unfilled shifts, per day or per week. The data comes from a read model of the
        Analytics service, which consumes the Kafka events of the Scheduling service. The read model is
        eventually consistent: `asOf` shows its freshness, and the normal lag is less than 5 s.

        **Roles:** MANAGER (own locations), ADMIN.

        **Concurrency:** None. The operation is a safe GET, and the client can retry it.

        **Requirements:** REQ-FUNC-018.

        **API ID:** `x-api-id: API-12`.
      parameters:
        - $ref: '#/components/parameters/LocationId'
        - name: from
          in: query
          required: true
          description: The first day of the range (local date of the location).
          schema:
            type: string
            format: date
          example: '2026-11-02'
        - name: to
          in: query
          required: true
          description: The last day of the range (included). The range can have 92 days or less.
          schema:
            type: string
            format: date
          example: '2026-11-08'
        - name: granularity
          in: query
          required: false
          description: The length of one item in `items`.
          schema:
            type: string
            enum: [DAY, WEEK]
            default: DAY
          example: DAY
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The coverage of the location.
          headers:
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coverage'
              examples:
                weekByDay:
                  summary: The coverage of Rynok Square for the week of 2026-11-02, per day
                  value:
                    locationId: '7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a'
                    from: '2026-11-02'
                    to: '2026-11-08'
                    granularity: DAY
                    asOf: '2026-11-09T09:15:03+02:00'
                    totals:
                      requiredSlots: 120
                      filledSlots: 114
                      coverageRate: 0.95
                      unfilledShifts: 5
                    items:
                      - periodStart: '2026-11-02'
                        requiredSlots: 16
                        filledSlots: 16
                        coverageRate: 1
                        unfilledShifts: 0
                      - periodStart: '2026-11-03'
                        requiredSlots: 16
                        filledSlots: 15
                        coverageRate: 0.9375
                        unfilledShifts: 1
                      - periodStart: '2026-11-04'
                        requiredSlots: 16
                        filledSlots: 16
                        coverageRate: 1
                        unfilledShifts: 0
                      - periodStart: '2026-11-05'
                        requiredSlots: 18
                        filledSlots: 17
                        coverageRate: 0.9444
                        unfilledShifts: 1
                      - periodStart: '2026-11-06'
                        requiredSlots: 18
                        filledSlots: 18
                        coverageRate: 1
                        unfilledShifts: 0
                      - periodStart: '2026-11-07'
                        requiredSlots: 20
                        filledSlots: 18
                        coverageRate: 0.9
                        unfilledShifts: 2
                      - periodStart: '2026-11-08'
                        requiredSlots: 16
                        filledSlots: 14
                        coverageRate: 0.875
                        unfilledShifts: 1
                weekTotal:
                  summary: The same week with `granularity=WEEK`
                  value:
                    locationId: '7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a'
                    from: '2026-11-02'
                    to: '2026-11-08'
                    granularity: WEEK
                    asOf: '2026-11-09T09:15:03+02:00'
                    totals:
                      requiredSlots: 120
                      filledSlots: 114
                      coverageRate: 0.95
                      unfilledShifts: 5
                    items:
                      - periodStart: '2026-11-02'
                        requiredSlots: 120
                        filledSlots: 114
                        coverageRate: 0.95
                        unfilledShifts: 5
        '400':
          description: 'A query parameter has a wrong format. Code: `VALIDATION_FAILED`. For a query parameter, `pointer` is `/` and the parameter name.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                validationFailed:
                  summary: The date has a wrong format
                  description: |-
                    **Cause:** Iryna Bondar sends `from=02.11.2026`.

                    **Client reaction:** Show the message next to the date field and do not retry without a change.
                  value:
                    type: 'https://docs.shifthappens.example/problems/validation-failed'
                    title: Request validation failed
                    status: 400
                    detail: The query has 1 parameter error.
                    instance: '/api/v1/locations/7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a/analytics/coverage'
                    code: VALIDATION_FAILED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    errors:
                      - pointer: /from
                        code: INVALID_FORMAT
                        message: Must be a date in the format YYYY-MM-DD.
        '403':
          description: 'The caller cannot see the analytics of this location. Codes: `ROLE_NOT_ALLOWED`, `LOCATION_SCOPE_DENIED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                roleNotAllowed:
                  summary: An employee opens the analytics
                  description: |-
                    **Cause:** Olena Kovalenko (EMPLOYEE) sends the request.

                    **Client reaction:** Hide the Analytics menu item for employees and do not retry.
                  value:
                    type: 'https://docs.shifthappens.example/problems/role-not-allowed'
                    title: Role not allowed
                    status: 403
                    detail: The role EMPLOYEE cannot view coverage analytics.
                    instance: '/api/v1/locations/7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a/analytics/coverage'
                    code: ROLE_NOT_ALLOWED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                locationScopeDenied:
                  summary: The location is not in the scope of the manager
                  description: |-
                    **Cause:** A manager of another location of Lviv Coffee Co. opens the Rynok Square analytics.

                    **Client reaction:** Do not retry, reload the membership context with `GET /me` and show only the locations from it.
                  value:
                    type: 'https://docs.shifthappens.example/problems/location-scope-denied'
                    title: Location not in scope
                    status: 403
                    detail: Location 7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a is not in your scope.
                    instance: '/api/v1/locations/7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a/analytics/coverage'
                    code: LOCATION_SCOPE_DENIED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
        '404':
          description: 'The location is not visible to the caller. Code: `RESOURCE_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
              examples:
                resourceNotFound:
                  summary: The location is in another organization
                  description: |-
                    **Cause:** A manager of another organization sends the request. Tenant isolation hides the location.

                    **Client reaction:** Remove the stale location, reload the list of locations and do not retry.
                  value:
                    type: 'https://docs.shifthappens.example/problems/resource-not-found'
                    title: Resource not found
                    status: 404
                    detail: Location 7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a was not found.
                    instance: '/api/v1/locations/7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a/analytics/coverage'
                    code: RESOURCE_NOT_FOUND
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    resource:
                      type: Location
                      id: '7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a'
        '422':
          description: '`from` is later than `to`, or the range is longer than 92 days. Code: `INVALID_DATE_RANGE`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                invalidDateRange:
                  summary: The start of the range is after the end
                  description: |-
                    **Cause:** Iryna Bondar sends `from=2026-11-08&to=2026-11-02`.

                    **Client reaction:** Show the message next to the date fields.
                  value:
                    type: 'https://docs.shifthappens.example/problems/invalid-date-range'
                    title: Invalid date range
                    status: 422
                    detail: from must not be later than to, and the range must not be longer than 92 days.
                    instance: '/api/v1/locations/7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a/analytics/coverage'
                    code: INVALID_DATE_RANGE
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    errors:
                      - pointer: /to
                        code: BEFORE_FROM
                        message: Must not be earlier than from (2026-11-08).
        '429':
          description: 'The `analytics` rate limit policy is empty (30 requests per 60 s). Code: `RATE_LIMITED`.'
          headers:
            Retry-After:
              description: Seconds to wait. The same value as `retryAfterSeconds`.
              schema:
                type: integer
                minimum: 0
              example: 8
            RateLimit-Policy:
              description: The policy of the operation. `q` is the quota, `w` is the window in seconds.
              schema:
                type: string
              example: '"analytics";q=30;w=60'
            RateLimit:
              description: The state of the policy. `r` is the remaining quota, `t` is the seconds until a reset.
              schema:
                type: string
              example: '"analytics";r=0;t=8'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/RateLimitProblem'
              examples:
                rateLimited:
                  summary: Too many analytics requests in 60 s
                  description: |-
                    **Cause:** The dashboard of Iryna Bondar reloads the coverage for many date ranges, 30 requests in 60 s.

                    **Client reaction:** Show a countdown of `Retry-After` seconds, then retry the GET with exponential backoff and jitter.
                  value:
                    type: 'https://docs.shifthappens.example/problems/rate-limited'
                    title: Too many requests
                    status: 429
                    detail: You sent 30 analytics requests in 60 s. Wait 8 s.
                    instance: '/api/v1/locations/7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a/analytics/coverage'
                    code: RATE_LIMITED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    retryAfterSeconds: 8
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    cognitoBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        An Amazon Cognito access token (JWT). The Angular SPA gets it with the OAuth 2.0 Authorization
        Code flow with PKCE through the Cognito managed login. The access token is valid for 15 min.
        The SPA keeps it in memory and gets a new one with the refresh token (30 days, rotation).
        The Edge Gateway validates the signature against the Cognito JWKS and loads the membership
        context of the `sub` claim.

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: The ID of the organization (tenant).
      schema:
        type: string
        format: uuid
      example: '0b9f5c3e-2d1a-4f6b-8c7d-9e0a1b2c3d4e'
    UserId:
      name: userId
      in: path
      required: true
      description: The user ID of the member (the Cognito `sub`).
      schema:
        type: string
        format: uuid
      example: '6c2f7d3b-9a4e-4b8f-8d2c-3e5a7b9f1d24'
    LocationId:
      name: locationId
      in: path
      required: true
      description: The ID of the location.
      schema:
        type: string
        format: uuid
      example: '7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a'
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      description: The ID of the schedule.
      schema:
        type: string
        format: uuid
      example: 'c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f'
    ShiftId:
      name: shiftId
      in: path
      required: true
      description: The ID of the shift.
      schema:
        type: string
        format: uuid
      example: 'd5e6f7a8-b9c0-4d1e-8f2a-3b4c5d6e7f80'
    TradeRequestId:
      name: tradeRequestId
      in: path
      required: true
      description: The ID of the trade request.
      schema:
        type: string
        format: uuid
      example: '1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: |-
        A UUID that the client generates for one user action. Send the same key with each retry of the
        same action. The server keeps the key and the response for 24 h. A missing key returns 400
        `IDEMPOTENCY_KEY_MISSING`.
      schema:
        type: string
        format: uuid
      example: '0f8d6c1e-3b5a-4e7d-9c2b-6a4f8e1d3c57'
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: |-
        Optional. A UUID that the client generates for one user action. With a key, a retry of the same
        action returns the stored response and does not create a second object. The server keeps the
        key and the response for 24 h.
      schema:
        type: string
        format: uuid
      example: '0f8d6c1e-3b5a-4e7d-9c2b-6a4f8e1d3c57'
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: Optional W3C Trace Context header. Without it, the Edge Gateway starts a new trace.
      schema:
        type: string
        pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      example: '00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01'

  headers:
    Retry-After:
      description: |-
        The number of seconds to wait before the next request (RFC 9110, section 10.2.3). It has the
        same value as `retryAfterSeconds` in the problem body. It has priority over `RateLimit`.
      schema:
        type: integer
        minimum: 0
      example: 23
    RateLimit-Policy:
      description: |-
        The quota policies of the operation (IETF draft-ietf-httpapi-ratelimit-headers). `q` is the
        quota and `w` is the window in seconds.
      schema:
        type: string
      example: '"default";q=100;w=60'
    RateLimit:
      description: |-
        The state of the policy that stopped the request (IETF draft-ietf-httpapi-ratelimit-headers).
        `r` is the remaining quota and `t` is the number of seconds until the quota resets.
      schema:
        type: string
      example: '"default";r=0;t=23'
    Idempotent-Replayed:
      description: |-
        Present with the value `true` when the response is the stored response of an earlier request
        with the same `Idempotency-Key`. The server did not run the operation again.
      schema:
        type: string
        enum: ['true']
      example: 'true'
    traceparent:
      description: |-
        The W3C Trace Context of the request. Its trace-id part is the same value as `traceId` in a
        problem body.
      schema:
        type: string
        pattern: '^00-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
      example: '00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01'
    WWW-Authenticate:
      description: The authentication challenge of RFC 6750 for a bearer token.
      schema:
        type: string
      example: 'Bearer error="invalid_token", error_description="The access token expired"'

  responses:
    Unauthorized:
      description: |-
        The request has no access token, the signature is not valid, or the token expired.
        Code: `AUTHENTICATION_REQUIRED`. The Edge Gateway returns this response before the request
        reaches a service.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
        traceparent:
          $ref: '#/components/headers/traceparent'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            authenticationRequired:
              summary: The access token expired
              description: |-
                **Cause:** Olena Kovalenko claims a shift (API-08) 16 min after the last token refresh. The access token is valid for 15 min. Other operations return the same body with their own `instance`.

                **Client reaction:** Refresh the token one time and repeat the request; if it fails again, go to the sign-in page.
              value:
                type: 'https://docs.shifthappens.example/problems/authentication-required'
                title: Authentication required
                status: 401
                detail: The access token expired.
                instance: '/api/v1/shifts/d5e6f7a8-b9c0-4d1e-8f2a-3b4c5d6e7f80/claims'
                code: AUTHENTICATION_REQUIRED
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
    RateLimited:
      description: |-
        The `default` rate limit policy (100 requests per 60 s per user) is empty. Code: `RATE_LIMITED`.
        API-02 and API-04 use this policy. The operations with a dedicated policy (`invitations`,
        `claims`, `trades`, `analytics`) have their own 429 response.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimit-Policy'
        RateLimit:
          $ref: '#/components/headers/RateLimit'
        traceparent:
          $ref: '#/components/headers/traceparent'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RateLimitProblem'
          examples:
            rateLimited:
              summary: Too many requests in 60 s
              description: |-
                **Cause:** A browser script of Iryna Bondar repeats the request to create a schedule (API-04), more than 100 times in 60 s. API-02 returns the same body with its own `instance`; there the limit also stops scripts that try many invitation tokens.

                **Client reaction:** Wait `Retry-After` seconds with a countdown on the button, then retry with exponential backoff and jitter.
              value:
                type: 'https://docs.shifthappens.example/problems/rate-limited'
                title: Too many requests
                status: 429
                detail: You sent more than 100 requests in 60 s. Wait 23 s.
                instance: '/api/v1/locations/7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a/schedules'
                code: RATE_LIMITED
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                retryAfterSeconds: 23
    InternalError:
      description: |-
        An unexpected error. Code: `INTERNAL_ERROR`. The body has no internal details. The logs and
        traces have the details under the same `traceId`.
      headers:
        traceparent:
          $ref: '#/components/headers/traceparent'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internalError:
              summary: An unexpected error
              description: |-
                **Cause:** The Analytics service has an unexpected error while it reads the coverage (API-12). Other operations return the same body with their own `instance`.

                **Client reaction:** Show a generic error with the `traceId`; retry a GET only.
              value:
                type: 'https://docs.shifthappens.example/problems/internal-error'
                title: Internal error
                status: 500
                detail: An unexpected error occurred. Give the trace ID to support.
                instance: '/api/v1/locations/7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a/analytics/coverage'
                code: INTERNAL_ERROR
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
    ServiceUnavailable:
      description: |-
        A dependency is not available, or a circuit breaker is open. Code: `SERVICE_UNAVAILABLE`. The
        server did not apply the change.
      headers:
        Retry-After:
          description: The number of seconds to wait. The same value as `retryAfterSeconds`.
          schema:
            type: integer
            minimum: 0
          example: 5
        traceparent:
          $ref: '#/components/headers/traceparent'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RateLimitProblem'
          examples:
            serviceUnavailable:
              summary: The service cannot complete the request now
              description: |-
                **Cause:** Iryna Bondar publishes a schedule (API-06), but the outbox write fails and the transaction rolls back (CS-5). Other operations return the same body with their own `instance`.

                **Client reaction:** Retry after `Retry-After` seconds with exponential backoff (max 3 times); then show the error with the `traceId`.
              value:
                type: 'https://docs.shifthappens.example/problems/service-unavailable'
                title: Service unavailable
                status: 503
                detail: The service is not available now. Try again after 5 s.
                instance: '/api/v1/schedules/c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f/publish'
                code: SERVICE_UNAVAILABLE
                traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                retryAfterSeconds: 5

  schemas:
    # ---------------------------------------------------------------- problem details (RFC 9457)
    Problem:
      type: object
      description: |-
        The error body of all 4xx and 5xx responses (RFC 9457, `application/problem+json`). The
        extension schemas below add members for some codes. Clients must ignore members that they do
        not know.
      required: [type, title, status, detail, instance, code, traceId]
      properties:
        type:
          type: string
          format: uri
          description: The problem type. It is `https://docs.shifthappens.example/problems/` and the code in kebab case.
          examples: ['https://docs.shifthappens.example/problems/slot-filled']
        title:
          type: string
          description: A short, stable summary of the problem type. It does not change from occurrence to occurrence.
          examples: [No open slot]
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status code. It is always the same as the status of the response.
          examples: [409]
        detail:
          type: string
          description: An explanation of this occurrence for a human. Clients do not parse it.
          examples: [Shift d5e6f7a8-b9c0-4d1e-8f2a-3b4c5d6e7f80 has no open slot. Another employee took the last slot.]
        instance:
          type: string
          format: uri-reference
          description: The path of the request.
          examples: ['/api/v1/shifts/d5e6f7a8-b9c0-4d1e-8f2a-3b4c5d6e7f80/claims']
        code:
          type: string
          description: The stable machine code of the problem. Clients switch on this value.
          enum:
            - MALFORMED_REQUEST
            - VALIDATION_FAILED
            - IDEMPOTENCY_KEY_MISSING
            - AUTHENTICATION_REQUIRED
            - ROLE_NOT_ALLOWED
            - LOCATION_SCOPE_DENIED
            - NOT_RESOURCE_OWNER
            - NOT_TRADE_TARGET
            - MFA_REQUIRED
            - INVITATION_EMAIL_MISMATCH
            - RESOURCE_NOT_FOUND
            - VERSION_CONFLICT
            - SLOT_FILLED
            - ASSIGNMENT_OVERLAP
            - ALREADY_ASSIGNED
            - CAPACITY_BELOW_ASSIGNED
            - SHIFT_ALREADY_STARTED
            - SCHEDULE_ALREADY_EXISTS
            - SCHEDULE_ALREADY_PUBLISHED
            - ASSIGNMENT_LOCKED
            - TRADE_NOT_PENDING
            - ALREADY_MEMBER
            - INVITATION_ALREADY_PENDING
            - INVITATION_ALREADY_USED
            - MEMBER_ALREADY_DEACTIVATED
            - LAST_ADMIN
            - IDEMPOTENCY_REQUEST_IN_PROGRESS
            - LABOR_RULE_VIOLATION
            - POSITION_NOT_QUALIFIED
            - INVALID_TIME_RANGE
            - INVALID_WEEK_START
            - SCHEDULE_NOT_PUBLISHABLE
            - TRADE_CUTOFF_PASSED
            - TRADE_POSITION_MISMATCH
            - INVALID_TRADE_TARGET
            - INVITATION_EXPIRED
            - EFFECTIVE_DATE_IN_PAST
            - INVALID_DATE_RANGE
            - IDEMPOTENCY_KEY_REUSED
            - RATE_LIMITED
            - INVITATION_QUOTA_EXCEEDED
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
        traceId:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: The W3C trace ID of the request. Support uses it to find the logs and traces.
          examples: ['4bf92f3577b34da6a3ce929d0e0e4736']
    ValidationProblem:
      description: A problem with field errors. Used by 400 `VALIDATION_FAILED` and by the 422 codes that point to fields.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - INVALID_TIME_RANGE
                - INVALID_WEEK_START
                - SCHEDULE_NOT_PUBLISHABLE
                - INVALID_TRADE_TARGET
                - EFFECTIVE_DATE_IN_PAST
                - INVALID_DATE_RANGE
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      description: One error of one field.
      required: [pointer, code, message]
      properties:
        pointer:
          type: string
          description: |-
            A JSON Pointer (RFC 6901) to the field in the request body, for example `/override/reason`.
            For a query parameter, it is `/` and the parameter name. For `SCHEDULE_NOT_PUBLISHABLE`, it
            points into the schedule resource, for example `/shifts/3/positionId`.
          examples: [/email]
        code:
          type: string
          description: The stable machine code of the field error.
          enum:
            - REQUIRED
            - INVALID_FORMAT
            - INVALID_TYPE
            - INVALID_VALUE
            - NOT_ALLOWED
            - TOO_SHORT
            - TOO_LONG
            - OUT_OF_RANGE
            - NOT_A_MONDAY
            - IN_THE_PAST
            - END_NOT_AFTER_START
            - OUTSIDE_SCHEDULE_WEEK
            - BEFORE_FROM
            - RANGE_TOO_LONG
            - NO_SHIFTS
            - POSITION_INACTIVE
            - SHIFT_TOO_LONG
        message:
          type: string
          description: A message for a human. The SPA shows it next to the field.
          examples: [Must be a valid email address.]
    LaborRuleProblem:
      description: A problem for 422 `LABOR_RULE_VIOLATION`. It lists every rule that fails.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [violations, overridable]
          properties:
            code:
              type: string
              const: LABOR_RULE_VIOLATION
            violations:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/LaborRuleViolation'
            overridable:
              type: boolean
              description: True only when the caller can send the request again with `override.reason` (a MANAGER or an ADMIN on API-07 and API-11).
    LaborRuleViolation:
      type: object
      description: One labor rule that the request breaks.
      required: [rule, limit, actual, unit, employeeId]
      properties:
        rule:
          type: string
          enum: [MIN_REST, MAX_WEEKLY_HOURS, MAX_SHIFT_HOURS]
          description: The rule of the labor policy.
        limit:
          type: number
          description: The value from the labor policy, for example 11 for `minRestHours`.
        actual:
          type: number
          description: The value that the request causes.
        unit:
          type: string
          enum: [HOURS]
        employeeId:
          type: string
          format: uuid
          description: The employee for whom the rule fails.
        conflictingAssignmentId:
          type: string
          format: uuid
          description: The other assignment that causes the violation, when there is one.
    VersionConflictProblem:
      description: A problem for 409 `VERSION_CONFLICT` (optimistic concurrency, CS-2).
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [currentVersion]
          properties:
            code:
              type: string
              const: VERSION_CONFLICT
            currentVersion:
              type: integer
              minimum: 1
              description: The version on the server now.
    ConflictProblem:
      description: A problem for a 409 code that depends on the current state of a resource. `currentState` shows the values that block the request.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [currentState]
          properties:
            code:
              type: string
              enum:
                - SLOT_FILLED
                - ASSIGNMENT_OVERLAP
                - ALREADY_ASSIGNED
                - CAPACITY_BELOW_ASSIGNED
                - SHIFT_ALREADY_STARTED
                - SCHEDULE_ALREADY_EXISTS
                - SCHEDULE_ALREADY_PUBLISHED
                - ASSIGNMENT_LOCKED
                - TRADE_NOT_PENDING
                - ALREADY_MEMBER
                - INVITATION_ALREADY_PENDING
                - INVITATION_ALREADY_USED
                - MEMBER_ALREADY_DEACTIVATED
                - LAST_ADMIN
            currentState:
              $ref: '#/components/schemas/CurrentState'
    CurrentState:
      type: object
      description: The current values that block the request. Each code uses the members that apply to it.
      minProperties: 1
      properties:
        status:
          type: string
          description: The current status of the resource (trade request, schedule, membership or invitation).
        version:
          type: integer
        capacity:
          type: integer
        assignedCount:
          type: integer
        openSlots:
          type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        deactivatedAt:
          type: string
          format: date-time
        scheduleId:
          type: string
          format: uuid
        assignmentId:
          type: string
          format: uuid
        conflictingAssignmentId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        tradeLock:
          type: string
          format: uuid
          description: The ID of the trade request that holds the trade lock.
        userId:
          type: string
          format: uuid
        invitationId:
          type: string
          format: uuid
        activeAdminCount:
          type: integer
    NotFoundProblem:
      description: A problem for 404 `RESOURCE_NOT_FOUND`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [resource]
          properties:
            code:
              type: string
              const: RESOURCE_NOT_FOUND
            resource:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [Organization, Location, Member, Invitation, Schedule, Shift, Assignment, TradeRequest]
                id:
                  type: string
                  format: uuid
                  description: The ID from the request. It is absent when the request identifies the resource with a secret token.
    RateLimitProblem:
      description: A problem that tells the client when to retry. Used by 429 and 503.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [retryAfterSeconds]
          properties:
            code:
              type: string
              enum: [RATE_LIMITED, INVITATION_QUOTA_EXCEEDED, SERVICE_UNAVAILABLE]
            retryAfterSeconds:
              type: integer
              minimum: 0
              description: The same value as the `Retry-After` header.

    # ---------------------------------------------------------------- enums
    Role:
      type: string
      enum: [EMPLOYEE, MANAGER, ADMIN]
      description: The role of a membership. One role per membership.
    MembershipStatus:
      type: string
      enum: [ACTIVE, DEACTIVATED]
    ScheduleStatus:
      type: string
      enum: [DRAFT, PUBLISHED]
      description: '`DRAFT` changes to `PUBLISHED` one time. The change is one way.'
    AssignmentStatus:
      type: string
      enum: [ACTIVE, CANCELLED]
    TradeType:
      type: string
      enum: [SWAP, COVER]
    TradeStatus:
      type: string
      enum: [PENDING_PEER, PENDING_MANAGER, EXECUTING, APPROVED, REJECTED, CANCELLED, EXPIRED, FAILED]
      description: The final states are `APPROVED`, `REJECTED`, `CANCELLED`, `EXPIRED` and `FAILED`.

    # ---------------------------------------------------------------- organization
    InviteMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role, locationIds, positionIds]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/Role'
        locationIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        positionIds:
          type: array
          uniqueItems: true
          description: The positions for which the member is qualified. It can be empty for an ADMIN.
          items:
            type: string
            format: uuid
    Invitation:
      type: object
      required: [id, orgId, email, role, locationIds, positionIds, status, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        locationIds:
          type: array
          items:
            type: string
            format: uuid
        positionIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          enum: [PENDING, ACCEPTED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
          description: 7 days after `createdAt`.
        createdAt:
          type: string
          format: date-time
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: The opaque token from the invitation email (43 characters, base64url).
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
    Membership:
      type: object
      required: [orgId, userId, role, locationIds, positionIds, status, joinedAt]
      properties:
        orgId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        locationIds:
          type: array
          items:
            type: string
            format: uuid
        positionIds:
          type: array
          items:
            type: string
            format: uuid
        status:
          $ref: '#/components/schemas/MembershipStatus'
        joinedAt:
          type: string
          format: date-time
    DeactivateMemberRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: The reason for the audit log.
        effectiveAt:
          type: string
          format: date-time
          description: The time when the deactivation takes effect. Default is the time of the request. It must not be earlier than now minus 5 min.
    Member:
      type: object
      required: [userId, orgId, status, deactivatedAt]
      properties:
        userId:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/MembershipStatus'
        deactivatedAt:
          type: string
          format: date-time

    # ---------------------------------------------------------------- scheduling
    CreateScheduleRequest:
      type: object
      additionalProperties: false
      required: [weekStart]
      properties:
        weekStart:
          type: string
          format: date
          description: A Monday in the time zone of the location. It must not be in the past.
    Schedule:
      type: object
      required: [id, locationId, weekStart, status, version, shifts, createdAt]
      properties:
        id:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        weekStart:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ScheduleStatus'
        version:
          type: integer
          minimum: 1
          description: Increments on each change of the schedule or of its shifts.
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/Shift'
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          description: Present when `status` is `PUBLISHED`.
    Shift:
      type: object
      required: [id, scheduleId, locationId, positionId, startsAt, endsAt, capacity, assignedCount, openSlots, note, version, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        scheduleId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1
          maximum: 50
          description: The number of employees that the shift needs.
        assignedCount:
          type: integer
          minimum: 0
        openSlots:
          type: integer
          minimum: 0
          description: '`capacity` minus `assignedCount`.'
        note:
          type: [string, 'null']
          maxLength: 500
        version:
          type: integer
          minimum: 1
          description: Increments on each change of the shift.
        updatedAt:
          type: string
          format: date-time
    UpdateShiftRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [version]
      description: The `version` that the client read and one or more fields to change.
      properties:
        version:
          type: integer
          minimum: 1
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        positionId:
          type: string
          format: uuid
        capacity:
          type: integer
          minimum: 1
          maximum: 50
        note:
          type: [string, 'null']
          maxLength: 500
          description: The value `null` removes the note.
    PublishScheduleRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: The version of the schedule that the manager reviewed.
    AssignEmployeeRequest:
      type: object
      additionalProperties: false
      required: [employeeId]
      properties:
        employeeId:
          type: string
          format: uuid
        override:
          $ref: '#/components/schemas/Override'
    Override:
      type: object
      additionalProperties: false
      required: [reason]
      description: A decision of a manager to accept a labor rule violation. It goes to the audit log.
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 500
    Assignment:
      type: object
      required: [id, shiftId, employeeId, status, source, overridden, tradeLock, createdAt]
      properties:
        id:
          type: string
          format: uuid
        shiftId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        source:
          type: string
          enum: [MANAGER, CLAIM, TRADE]
          description: How the assignment was created.
        overridden:
          type: boolean
          description: True when a manager accepted a labor rule violation for this assignment.
        tradeLock:
          type: [string, 'null']
          format: uuid
          description: The ID of the pending trade request that locks the assignment, or null.
        createdAt:
          type: string
          format: date-time

    # ---------------------------------------------------------------- trades
    CreateTradeRequestRequest:
      description: A `SWAP` must have `requestedAssignmentId`. A `COVER` must not have it and can have `targetEmployeeId`.
      oneOf:
        - $ref: '#/components/schemas/CreateSwapTradeRequest'
        - $ref: '#/components/schemas/CreateCoverTradeRequest'
      discriminator:
        propertyName: type
        mapping:
          SWAP: '#/components/schemas/CreateSwapTradeRequest'
          COVER: '#/components/schemas/CreateCoverTradeRequest'
    CreateSwapTradeRequest:
      type: object
      additionalProperties: false
      required: [type, offeredAssignmentId, requestedAssignmentId]
      properties:
        type:
          type: string
          const: SWAP
        offeredAssignmentId:
          type: string
          format: uuid
          description: An own active assignment of the requester.
        requestedAssignmentId:
          type: string
          format: uuid
          description: The assignment of the colleague. Its owner becomes the target.
        message:
          type: string
          maxLength: 500
    CreateCoverTradeRequest:
      type: object
      additionalProperties: false
      required: [type, offeredAssignmentId]
      properties:
        type:
          type: string
          const: COVER
        offeredAssignmentId:
          type: string
          format: uuid
          description: An own active assignment of the requester.
        targetEmployeeId:
          type: string
          format: uuid
          description: Optional. Without it, any qualified colleague of the location can accept.
        message:
          type: string
          maxLength: 500
    TradeRequest:
      type: object
      required: [id, type, status, requesterId, offeredAssignmentId, requestedAssignmentId, targetEmployeeId, acceptedBy, expiresAt, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TradeType'
        status:
          $ref: '#/components/schemas/TradeStatus'
        requesterId:
          type: string
          format: uuid
        offeredAssignmentId:
          type: string
          format: uuid
        requestedAssignmentId:
          type: [string, 'null']
          format: uuid
          description: Null for a `COVER`.
        targetEmployeeId:
          type: [string, 'null']
          format: uuid
          description: Null for an open `COVER`.
        acceptedBy:
          type: [string, 'null']
          format: uuid
          description: The employee who accepted, or null.
        message:
          type: string
          maxLength: 500
        expiresAt:
          type: string
          format: date-time
          description: 48 h after creation or the trade cutoff, whichever is earlier.
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    DecideTradeRequestRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
        comment:
          type: string
          maxLength: 500
        override:
          $ref: '#/components/schemas/Override'

    # ---------------------------------------------------------------- analytics
    Coverage:
      type: object
      required: [locationId, from, to, granularity, asOf, totals, items]
      properties:
        locationId:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        granularity:
          type: string
          enum: [DAY, WEEK]
        asOf:
          type: string
          format: date-time
          description: The time of the last event in the read model. It shows the freshness of the data.
        totals:
          type: object
          required: [requiredSlots, filledSlots, coverageRate, unfilledShifts]
          properties:
            requiredSlots:
              type: integer
              minimum: 0
            filledSlots:
              type: integer
              minimum: 0
            coverageRate:
              type: number
              minimum: 0
              maximum: 1
              description: '`filledSlots` divided by `requiredSlots`.'
            unfilledShifts:
              type: integer
              minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/CoveragePeriod'
    CoveragePeriod:
      type: object
      required: [periodStart, requiredSlots, filledSlots, coverageRate, unfilledShifts]
      properties:
        periodStart:
          type: string
          format: date
          description: The first day of the period (a Monday for `WEEK`).
        requiredSlots:
          type: integer
          minimum: 0
        filledSlots:
          type: integer
          minimum: 0
        coverageRate:
          type: number
          minimum: 0
          maximum: 1
        unfilledShifts:
          type: integer
          minimum: 0
          description: Shifts with at least one open slot at the shift start.
