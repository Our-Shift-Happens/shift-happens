  /shifts/{shiftId}/assignments:
    post:
      operationId: assignEmployee
      x-api-id: API-07
      x-service: Scheduling service (`scheduling-service`)
      x-requirements: [REQ-FUNC-009, REQ-FUNC-016]
      x-concurrency: [CS-1]
      tags: [Scheduling]
      summary: 'API-07: Assign an employee to a shift'
      description: |-
        A manager assigns an employee to a shift. The Scheduling service locks the shift row and then
        the employee-week row (`SELECT … FOR UPDATE`, fixed lock order). Then it checks capacity,
        overlaps, qualification and labor rules, and inserts the assignment. A PostgreSQL exclusion
        constraint on the employee and the time range is the last defense against overlaps.

        A manager can accept a labor rule violation: send the request again with `override.reason`.
        The override goes to the audit log, and the assignment gets `overridden: true`.

        **Roles:** MANAGER (own locations), ADMIN.

        **Concurrency:** CS-1 (pessimistic locking and exclusion constraint).

        **Requirements:** REQ-FUNC-009, REQ-FUNC-016.

        **API ID:** `x-api-id: API-07`.
      parameters:
        - $ref: '#/components/parameters/ShiftId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignEmployeeRequest'
            examples:
              assign:
                summary: Iryna Bondar assigns Olena Kovalenko
                value:
                  employeeId: '5b1e6c2a-8f3d-4a7e-9c1b-2d4f6a8e0c13'
              assignWithOverride:
                summary: Iryna Bondar assigns Olena Kovalenko and overrides the maximum weekly hours
                value:
                  employeeId: '5b1e6c2a-8f3d-4a7e-9c1b-2d4f6a8e0c13'
                  override:
                    reason: Two baristas are sick and Olena agreed
      responses:
        '201':
          description: The assignment is created.
          headers:
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
              examples:
                assignmentCreated:
                  summary: The new assignment without a violation
