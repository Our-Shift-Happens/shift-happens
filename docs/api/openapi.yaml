                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    errors:
                      - pointer: /shifts
                        code: NO_SHIFTS
                        message: The schedule has no shifts. Add one shift or more.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
