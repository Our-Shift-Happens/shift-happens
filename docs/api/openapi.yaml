                    code: IDEMPOTENCY_REQUEST_IN_PROGRESS
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
        '422':
          description: 'The trade breaks a trade rule, or the key was used for another request. Codes: `TRADE_CUTOFF_PASSED`, `TRADE_POSITION_MISMATCH`, `INVALID_TRADE_TARGET`, `IDEMPOTENCY_KEY_REUSED`.'
          content:
