      x-requirements: [REQ-FUNC-010, REQ-FUNC-016]
      x-concurrency: [CS-1, CS-4]
      tags: [Scheduling]
      summary: 'API-08: Claim an open shift'
      description: |-
        An employee claims an open slot of a published shift. No approval is necessary. The request
        has no body: the caller is the employee from the access token.

        Two employees can claim the last slot at the same time. The Scheduling service locks the shift
        row and then the employee-week row (`SELECT … FOR UPDATE`), so only one claim wins (CS-1). The
        `Idempotency-Key` header is required. A retry after a timeout returns the stored response with
        `Idempotent-Replayed: true` and does not create a second assignment (CS-4).

        **Roles:** EMPLOYEE (own locations, qualified positions).

        **Concurrency:** CS-1 (pessimistic locking and exclusion constraint), CS-4 (idempotency key).

        **Requirements:** REQ-FUNC-010, REQ-FUNC-016.

        **API ID:** `x-api-id: API-08`.
      parameters:
        - $ref: '#/components/parameters/ShiftId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '201':
          description: The claim is accepted and the assignment is created. A replay returns the same body with `Idempotent-Replayed`.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
              examples:
                shiftClaimed:
                  summary: Olena Kovalenko has the slot
                  value:
                    id: '9c0d1e2f-3a4b-4c5d-8e6f-7a8b9c0d1e2f'
                    shiftId: 'd5e6f7a8-b9c0-4d1e-8f2a-3b4c5d6e7f80'
                    employeeId: '5b1e6c2a-8f3d-4a7e-9c1b-2d4f6a8e0c13'
                    status: ACTIVE
                    source: CLAIM
                    overridden: false
                    tradeLock: null
                    createdAt: '2026-11-03T09:14:03+02:00'
        '400':
          description: 'The `Idempotency-Key` header is missing. Code: `IDEMPOTENCY_KEY_MISSING`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                idempotencyKeyMissing:
                  summary: The request has no idempotency key
                  description: |-
                    **Cause:** A new version of the SPA forgot to add the `Idempotency-Key` header.

                    **Client reaction:** This is a bug in the client: generate a UUID key and send the request again.
                  value:
                    type: 'https://docs.shifthappens.example/problems/idempotency-key-missing'
                    title: Idempotency key missing
                    status: 400
                    detail: The header Idempotency-Key is required for this operation.
                    instance: '/api/v1/shifts/d5e6f7a8-b9c0-4d1e-8f2a-3b4c5d6e7f80/claims'
                    code: IDEMPOTENCY_KEY_MISSING
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
        '403':
          description: 'The location of the shift is not one of the locations of the employee. Code: `LOCATION_SCOPE_DENIED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                locationScopeDenied:
                  summary: The shift is at another location
                  description: |-
                    **Cause:** An employee of another location of Lviv Coffee Co. claims the Rynok Square shift.

                    **Client reaction:** Do not retry, reload the membership context with `GET /me` and show only shifts of own locations.
                  value:
                    type: 'https://docs.shifthappens.example/problems/location-scope-denied'
                    title: Location not in scope
                    status: 403
                    detail: Location 7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a is not in your scope.
                    instance: '/api/v1/shifts/d5e6f7a8-b9c0-4d1e-8f2a-3b4c5d6e7f80/claims'
                    code: LOCATION_SCOPE_DENIED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
        '404':
          description: 'The shift does not exist, is in another organization, or is not published yet. Code: `RESOURCE_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
              examples:
                resourceNotFound:
                  summary: The shift is in a draft schedule
                  description: |-
                    **Cause:** Olena Kovalenko claims the shift before Iryna Bondar publishes the schedule. Employees cannot see draft shifts.

                    **Client reaction:** Remove the stale shift, reload the list of open shifts and do not retry.
                  value:
                    type: 'https://docs.shifthappens.example/problems/resource-not-found'
                    title: Resource not found
                    status: 404
                    detail: Shift d5e6f7a8-b9c0-4d1e-8f2a-3b4c5d6e7f80 was not found.
