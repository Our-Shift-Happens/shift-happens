  /trade-requests:
    post:
      operationId: createTradeRequest
      x-api-id: API-09
      x-service: Trade service (`trade-service`)
      x-requirements: [REQ-FUNC-011, REQ-FUNC-012]
      x-concurrency: [CS-3, CS-4]
      tags: [Trades]
      summary: 'API-09: Create a trade request (swap or cover)'
      description: |-
        An employee creates a trade request for an own active assignment. A `SWAP` exchanges the
        assignment with the assignment of a colleague. A `COVER` gives the assignment to a colleague.
        A `COVER` without `targetEmployeeId` is open to all qualified colleagues of the location.

        The Trade service starts the trade saga (CS-3). It calls the Scheduling service to verify the
        assignment and to place a trade lock on the offered assignment. The trade request expires 48 h
        after creation or at the trade cutoff (24 h before the shift start), whichever is earlier. The
        `Idempotency-Key` header is required (CS-4).

        **Roles:** EMPLOYEE (own active assignments).

        **Concurrency:** CS-3 (orchestrated saga and trade lock), CS-4 (idempotency key).

        **Requirements:** REQ-FUNC-011, REQ-FUNC-012.

        **API ID:** `x-api-id: API-09`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTradeRequestRequest'
            examples:
              swap:
                summary: Olena Kovalenko asks Taras Melnyk to swap the Thursday shift for his Friday shift
                value:
                  type: SWAP
                  offeredAssignmentId: 'e6f7a8b9-c0d1-4e2f-9a3b-4c5d6e7f8091'
                  requestedAssignmentId: 'f7a8b9c0-d1e2-4f3a-8b4c-5d6e7f809102'
                  message: Can we swap? I have a doctor appointment on Thursday morning.
              cover:
                summary: Olena Kovalenko asks Taras Melnyk to cover the Thursday shift
                value:
                  type: COVER
                  offeredAssignmentId: 'e6f7a8b9-c0d1-4e2f-9a3b-4c5d6e7f8091'
                  targetEmployeeId: '6c2f7d3b-9a4e-4b8f-8d2c-3e5a7b9f1d24'
                  message: Can you take my Thursday shift?
      responses:
        '201':
          description: The trade request is created and waits for the colleague. A replay returns the same body with `Idempotent-Replayed`.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeRequest'
              examples:
                swapCreated:
                  summary: The new swap request
                  value:
                    id: '1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5e'
                    type: SWAP
                    status: PENDING_PEER
                    requesterId: '5b1e6c2a-8f3d-4a7e-9c1b-2d4f6a8e0c13'
                    offeredAssignmentId: 'e6f7a8b9-c0d1-4e2f-9a3b-4c5d6e7f8091'
                    requestedAssignmentId: 'f7a8b9c0-d1e2-4f3a-8b4c-5d6e7f809102'
                    targetEmployeeId: '6c2f7d3b-9a4e-4b8f-8d2c-3e5a7b9f1d24'
                    acceptedBy: null
                    message: Can we swap? I have a doctor appointment on Thursday morning.
                    expiresAt: '2026-11-04T08:00:00+02:00'
                    createdAt: '2026-11-02T10:00:00+02:00'
                    version: 1
        '400':
          description: 'The body does not agree with the schema, or the key is missing. Codes: `VALIDATION_FAILED`, `IDEMPOTENCY_KEY_MISSING`.'
          content:
            application/problem+json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ValidationProblem'
                  - $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  summary: A swap without the requested assignment
                  description: |-
                    **Cause:** Olena Kovalenko sends `{"type": "SWAP", "offeredAssignmentId": "e6f7a8b9-c0d1-4e2f-9a3b-4c5d6e7f8091"}`.

                    **Client reaction:** Show the message next to the field of the colleague's shift and do not retry without a change.
                  value:
                    type: 'https://docs.shifthappens.example/problems/validation-failed'
                    title: Request validation failed
                    status: 400
                    detail: The request body has 1 field error.
                    instance: /api/v1/trade-requests
                    code: VALIDATION_FAILED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    errors:
                      - pointer: /requestedAssignmentId
                        code: REQUIRED
