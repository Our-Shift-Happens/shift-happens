                    status: 400
                    detail: The header Idempotency-Key is required for this operation.
                    instance: /api/v1/trade-requests
                    code: IDEMPOTENCY_KEY_MISSING
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
        '403':
