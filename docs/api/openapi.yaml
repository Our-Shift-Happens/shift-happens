        '422':
          description: 'The trade breaks a labor rule, a qualification rule or the trade cutoff. Codes: `LABOR_RULE_VIOLATION` (`overridable` is always false here), `POSITION_NOT_QUALIFIED`, `TRADE_CUTOFF_PASSED`.'
          content:
