      summary: 'API-04: Create a weekly draft schedule'
      description: |-
        Creates an empty `DRAFT` schedule for one location and one week. The week starts on Monday
        at 00:00 in the time zone of the location. A location has one schedule per week.

        **Roles:** MANAGER (own locations), ADMIN.

        **Concurrency:** None. The `Idempotency-Key` header is optional (CS-4). Without a key, a second request returns 409 `SCHEDULE_ALREADY_EXISTS`.

        **Requirements:** REQ-FUNC-006.

        **API ID:** `x-api-id: API-04`.
      parameters:
        - $ref: '#/components/parameters/LocationId'
        - $ref: '#/components/parameters/IdempotencyKeyOptional'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
            examples:
              weekOfNovember2:
                summary: Iryna Bondar creates the schedule for the week of 2026-11-02
                value:
                  weekStart: '2026-11-02'
      responses:
        '201':
          description: The draft schedule is created.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
            traceparent:
              $ref: '#/components/headers/traceparent'
