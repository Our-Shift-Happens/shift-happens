  /schedules/{scheduleId}/publish:
    post:
      operationId: publishSchedule
      x-api-id: API-06
      x-service: Scheduling service (`scheduling-service`)
      x-requirements: [REQ-FUNC-008]
      x-concurrency: [CS-2, CS-5]
      tags: [Scheduling]
      summary: 'API-06: Publish a schedule'
      description: |-
        Publishes a draft schedule. The server checks `version` (CS-2) and validates all shifts. In the
        same transaction, it writes the event `SchedulePublished` to the outbox (CS-5). The Notification
        service then informs all employees of the location. Publication is one way: a published schedule
        cannot go back to `DRAFT`. If the outbox write fails, the transaction rolls back and the server
        returns 503 `SERVICE_UNAVAILABLE`.

        **Roles:** MANAGER (own locations), ADMIN.

        **Concurrency:** CS-2 (optimistic concurrency control with `version`), CS-5 (transactional outbox and Kafka).

        **Requirements:** REQ-FUNC-008.

        **API ID:** `x-api-id: API-06`.
      parameters:
        - $ref: '#/components/parameters/ScheduleId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishScheduleRequest'
            examples:
              publishVersion12:
                summary: Iryna Bondar publishes the version that she reviewed
                value:
                  version: 12
      responses:
        '200':
          description: The schedule is published. The response shows one of the shifts.
          headers:
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
              examples:
                schedulePublished:
                  summary: The published schedule (one shift shown)
                  value:
                    id: 'c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f'
                    locationId: '7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a'
                    weekStart: '2026-11-02'
                    status: PUBLISHED
                    version: 13
                    shifts:
                      - id: 'd5e6f7a8-b9c0-4d1e-8f2a-3b4c5d6e7f80'
                        scheduleId: 'c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f'
                        locationId: '7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a'
                        positionId: 'a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d'
                        startsAt: '2026-11-07T08:00:00+02:00'
                        endsAt: '2026-11-07T16:00:00+02:00'
                        capacity: 2
                        assignedCount: 1
                        openSlots: 1
                        note: Bean delivery at 07:30. Open the back door. Latte art training at 09:00.
                        version: 5
                        updatedAt: '2026-10-29T16:20:00+02:00'
                    createdAt: '2026-10-29T09:00:00+02:00'
                    publishedAt: '2026-10-29T18:00:00+02:00'
        '400':
          description: 'The body does not agree with the schema. Code: `VALIDATION_FAILED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                validationFailed:
                  summary: The version is a string
                  description: |-
                    **Cause:** The SPA sends `{"version": "12"}`.

                    **Client reaction:** This is a bug in the client: log it, show a generic error and do not retry without a change.
                  value:
                    type: 'https://docs.shifthappens.example/problems/validation-failed'
                    title: Request validation failed
                    status: 400
                    detail: The request body has 1 field error.
                    instance: '/api/v1/schedules/c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f/publish'
                    code: VALIDATION_FAILED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
                    errors:
                      - pointer: /version
                        code: INVALID_TYPE
                        message: Must be an integer.
        '403':
          description: 'The location of the schedule is not in the scope of the caller. Code: `LOCATION_SCOPE_DENIED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                locationScopeDenied:
                  summary: The schedule is at a location of another manager
                  description: |-
                    **Cause:** A manager of another location of Lviv Coffee Co. publishes the Rynok Square schedule.

                    **Client reaction:** Do not retry, reload the membership context with `GET /me` and refresh the view.
                  value:
                    type: 'https://docs.shifthappens.example/problems/location-scope-denied'
                    title: Location not in scope
                    status: 403
                    detail: Location 7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a is not in your scope.
                    instance: '/api/v1/schedules/c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f/publish'
                    code: LOCATION_SCOPE_DENIED
                    traceId: '4bf92f3577b34da6a3ce929d0e0e4736'
        '404':
          description: 'The schedule is not visible to the caller. Code: `RESOURCE_NOT_FOUND`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotFoundProblem'
              examples:
                resourceNotFound:
                  summary: The schedule is in another organization
                  description: |-
                    **Cause:** A manager of another organization sends the request. Tenant isolation hides the schedule.

                    **Client reaction:** Remove the stale schedule, reload the list of schedules and do not retry.
                  value:
                    type: 'https://docs.shifthappens.example/problems/resource-not-found'
                    title: Resource not found
                    status: 404
                    detail: Schedule c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f was not found.
                    instance: '/api/v1/schedules/c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f/publish'
                    code: RESOURCE_NOT_FOUND
