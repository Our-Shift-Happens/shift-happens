  /shifts/{shiftId}:
    patch:
      operationId: updateShift
      x-api-id: API-05
      x-service: Scheduling service (`scheduling-service`)
      x-requirements: [REQ-FUNC-007, REQ-FUNC-016]
      x-concurrency: [CS-2]
      tags: [Scheduling]
      summary: 'API-05: Change a shift'
      description: |-
        Changes one shift. The body has the `version` that the client read and one or more fields to
        change. The server applies the change only when `version` is the current version of the shift
        (`UPDATE … WHERE id = $1 AND version = $2`). Each change increments the version of the shift
        and of its schedule. The server checks the labor rules again for all assigned employees.

        A shift of a published schedule can change until the shift starts. Each change of a published
        shift emits `ShiftChanged`, and the assigned employees get a notification.

        **Roles:** MANAGER (own locations), ADMIN.

        **Concurrency:** CS-2 (optimistic concurrency control with `version`).

        **Requirements:** REQ-FUNC-007, REQ-FUNC-016.

        **API ID:** `x-api-id: API-05`.
      parameters:
        - $ref: '#/components/parameters/ShiftId'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShiftRequest'
            examples:
              increaseCapacity:
                summary: Iryna Bondar adds a third barista to the Saturday shift
                value:
                  version: 3
                  capacity: 3
      responses:
        '200':
          description: The shift is changed. `version` is incremented.
          headers:
            traceparent:
              $ref: '#/components/headers/traceparent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
              examples:
                shiftUpdated:
                  summary: The changed shift
                  value:
                    id: 'd5e6f7a8-b9c0-4d1e-8f2a-3b4c5d6e7f80'
                    scheduleId: 'c4d5e6f7-a8b9-4c0d-9e1f-2a3b4c5d6e7f'
                    locationId: '7d3e2f1a-4b5c-4d6e-9f8a-0b1c2d3e4f5a'
                    positionId: 'a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d'
                    startsAt: '2026-11-07T08:00:00+02:00'
                    endsAt: '2026-11-07T16:00:00+02:00'
                    capacity: 3
                    assignedCount: 2
                    openSlots: 1
                    note: null
                    version: 4
                    updatedAt: '2026-10-30T12:12:00+02:00'
        '400':
          description: 'The body does not agree with the schema. Code: `VALIDATION_FAILED`.'
          content:
